name: 'test_project'
version: '1.0.0'
config-version: 2

# Points to target in profiles.yml
profile: 'test_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "CREATE SCHEMA IF NOT EXISTS f1_staging;"
  - "CREATE SCHEMA IF NOT EXISTS f1_marts;"
  - "ATTACH IF NOT EXISTS '/app/databases/formula1.duckdb' AS formula1 (READ_ONLY true);"

models:
  test_project:
    staging:
      formula1:
        +schema: f1_staging
        +materialized: view
    marts:
      formula1:
        +schema: f1_marts
        +materialized: table
