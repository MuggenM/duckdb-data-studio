# Configuration for Garage S3 object store

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

# 32-byte hex key for internal communication (rpc_secret)
rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "garage_admin_token_1337"
