version: "3.9"

networks:
  studio_jupyter_net:
    name: studio_jupyter_net
    driver: bridge

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8880:80"
    volumes:
      - "/run/user/1000/docker.sock:/var/run/docker.sock:ro"
    networks:
      - studio_jupyter_net
    restart: unless-stopped

  duckdb-studio:
    build: .
    container_name: duckdb-studio
    ports:
      - "8086:8085"
    volumes:
      - ./main.py:/app/main.py
      - ./local_file_picker:/app/local_file_picker
      - ./config:/config
      - ./templates:/templates
      - ./ducklake:/ducklake
      - ./databases:/databases
      - ./shared:/shared
    environment:
      - STORAGE_SECRET=duckdb_studio_secret_key_1337
      - JUPYTER_URL=http://jupyter.localhost:8880
      - JUPYTER_TOKEN=analytics_secret
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.rule=Host(`studio.localhost`)"
      - "traefik.http.routers.studio.entrypoints=web"
      - "traefik.http.services.studio.loadbalancer.server.port=8085"

  jupyter:
    image: arrowflight-jupyter:latest
    container_name: jupyter_lab
    user: root
    entrypoint: ["tini", "-g", "--"]
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./.env:/home/jovyan/.env
      - ./shared:/home/jovyan/work/shared
      - ./databases:/home/jovyan/work/databases
      - ./ducklake:/home/jovyan/work/ducklake
    working_dir: /home/jovyan/work
    networks:
      - studio_jupyter_net
    ports:
      - "127.0.0.1:8889:8888"
    command: ["jupyter", "lab", "--allow-root", "--ServerApp.token=analytics_secret", "--IdentityProvider.token=analytics_secret", "--ServerApp.tornado_settings={'headers': {'Content-Security-Policy': \"frame-ancestors 'self' http://studio.localhost:8880 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8085 http://127.0.0.1:8086\"}}"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`jupyter.localhost`)"
      - "traefik.http.routers.jupyter.entrypoints=web"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"

  dbt-workbench-db:
    image: postgres:13
    container_name: dbt-workbench-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=dbt_workbench
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - dbt_postgres_data:/var/lib/postgresql/data
    networks:
      - studio_jupyter_net
    restart: unless-stopped

  dbt-workbench-backend:
    image: dbt-workbench-backend:latest
    container_name: dbt-workbench-backend
    ports:
      - "8000:8000"
    depends_on:
      - dbt-workbench-db
    environment:
      - POSTGRES_HOST=dbt-workbench-db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dbt_workbench
      - DBT_ARTIFACTS_PATH=/app/data/artifacts
      - DBT_PROJECT_PATH=/app/data/repos/default
      - BACKEND_PORT=8000
      - SQL_WORKSPACE_DEFAULT_CONNECTION_URL=postgresql://user:password@dbt-workbench-db:5432/dbt_workbench
      - AI_ENABLED=true
      - AI_DEFAULT_MODE=direct
      - AI_DEFAULT_DIRECT_PROVIDER=openai
      - AI_ALLOW_SESSION_PROVIDER_OVERRIDE=true
      - AI_MCP_LOCAL_ALLOWLIST_JSON={}
    volumes:
      - ./dbt_data:/app/data
      - ./dbt_data/artifacts:/app/data/artifacts
      - ./dbt_data/repos:/app/data/repos
      - ./dbt_project:/app/data/repos/default
      - ./profiles:/app/data/profiles
    networks:
      - studio_jupyter_net
    restart: unless-stopped

  dbt-workbench-frontend:
    image: dbt-workbench-frontend:latest
    container_name: dbt-workbench-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://dbt-workbench-backend:8000
    depends_on:
      - dbt-workbench-backend
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.workbench.rule=Host(`workbench.localhost`)"
      - "traefik.http.routers.workbench.entrypoints=web"
      - "traefik.http.services.workbench.loadbalancer.server.port=3000"

  dbt-code-server:
    image: codercom/code-server:latest
    container_name: dbt-code-server
    ports:
      - "8443:8080"
    volumes:
      - ./dbt_project:/home/coder/project
      - ./profiles:/home/coder/.dbt
    command: ["--auth", "none", "/home/coder/project"]
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor.rule=Host(`editor.localhost`)"
      - "traefik.http.routers.editor.entrypoints=web"
      - "traefik.http.services.editor.loadbalancer.server.port=8080"

volumes:
  dbt_postgres_data:
