  dbt-code-server:
    build:
      context: .
      dockerfile: Dockerfile.codeserver
    container_name: dbt-code-server
    ports:
      - "8443:8080"
    volumes:
      - ./dbt_project:/home/coder/project
      - ./profiles:/home/coder/.dbt
      - ./dbt_data:/app/data
      - code-server-extensions:/home/coder/.local/share/code-server
      - ./entrypoint_codeserver.sh:/app/entrypoint_codeserver.sh
    environment:
      - AWS_ACCESS_KEY_ID=GK2713753aca1d72db5325f212
      - AWS_SECRET_ACCESS_KEY=afd53ab8d8e6f762973bab0b5a33998265530dee63cae200e1a8e065be2a4b6e
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://garage:3900
      - AWS_S3_ALLOW_UNSAFE_RENAME=true
      - AWS_ALLOW_HTTP=true
    entrypoint: ["/bin/bash", "/app/entrypoint_codeserver.sh"]
    command: ["--auth", "none", "--bind-addr", "0.0.0.0:8080", "/home/coder/project"]
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.editor.rule=Host(`editor.localhost`)"
      - "traefik.http.routers.editor.entrypoints=web"
      - "traefik.http.services.editor.loadbalancer.server.port=8080"

  garage:
    image: dxflrs/garage:v2.0.0
    container_name: duckdb-studio-garage
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - ./shared/garage/meta:/var/lib/garage/meta
      - ./shared/garage/data:/var/lib/garage/data
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage-api.rule=Host(`s3.localhost`)"
      - "traefik.http.routers.garage-api.entrypoints=web"
      - "traefik.http.services.garage-api.loadbalancer.server.port=3900"

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    environment:
      - API_BASE_URL=http://garage:3903
      - S3_ENDPOINT_URL=http://garage:3900
    depends_on:
      - garage
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage-webui.rule=Host(`garage.localhost`)"
      - "traefik.http.routers.garage-webui.entrypoints=web"
      - "traefik.http.services.garage-webui.loadbalancer.server.port=3909"

  superset:
    image: apache/superset:latest
    container_name: superset
    user: root
    entrypoint: >
      bash -c "
      pip install --target=/app/.venv/lib/python3.10/site-packages psycopg2-binary &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@localhost --password admin &&
      superset init &&
      superset import-datasources -p /app/superset_datasources.yaml &&
      /usr/bin/run-server.sh
      "
    ports:
      - "8088:8088"
    environment:
      - TALISMAN_ENABLED=False
      - SUPERSET_SECRET_KEY=superset_studio_secret_key_1337
      - SUPERSET_ENV=production
      - FLASK_APP=superset.app:create_app()
      - PYTHONPATH=/app/pythonpath
      - SUPERSET_PORT=8088
    volumes:
      - ./config/superset_config.py:/app/pythonpath/superset_config.py
      - ./config/superset_datasources.yaml:/app/superset_datasources.yaml
      - superset_home:/app/superset_home
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.superset.rule=Host(`superset.localhost`)"
      - "traefik.http.routers.superset.entrypoints=web"
      - "traefik.http.services.superset.loadbalancer.server.port=8088"

volumes:
  dbt_postgres_data:
  code-server-extensions:
  superset_home:

