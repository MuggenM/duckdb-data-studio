version: "3.9"

networks:
  studio_jupyter_net:
    name: studio_jupyter_net
    driver: bridge

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8880:80"
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - "/run/user/1000/docker.sock:/var/run/docker.sock:ro"
    networks:
      - studio_jupyter_net
    restart: unless-stopped

  duckdb-data-studio:
    build: .
    container_name: duckdb-studio
    ports:
      - "8086:8085"
    volumes:
      - ./init_stack.py:/app/init_stack.py
      - ./main.py:/app/main.py
      - ./s3_catalog_sync.py:/app/s3_catalog_sync.py
      - ./api_generator.py:/app/api_generator.py
      - ./scheduler.py:/app/scheduler.py
      - ./local_file_picker:/app/local_file_picker
      - ./config:/config
      - ./templates:/templates
      - ./ducklake:/ducklake
      - ./databases:/databases
      - ./shared:/shared
      - ./dbt_project:/app/dbt_project
      - ./dbt_data:/app/dbt_data
    environment:
      - STORAGE_SECRET=duckdb_studio_secret_key_1337
      - JUPYTER_URL=http://jupyter.localhost:8880
      - JUPYTER_TOKEN=analytics_secret
      - AWS_ACCESS_KEY_ID=GK2713753aca1d72db5325f212
      - AWS_SECRET_ACCESS_KEY=afd53ab8d8e6f762973bab0b5a33998265530dee63cae200e1a8e065be2a4b6e
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://garage:3900
      - AWS_S3_ALLOW_UNSAFE_RENAME=true
      - AWS_ALLOW_HTTP=true
    networks:
      - studio_jupyter_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # cpus: '4.0' # Fails on hosts where the kernel lacks CPU CFS scheduler support
          memory: 4G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.rule=Host(`studio.localhost`)"
      - "traefik.http.routers.studio.entrypoints=web"
      - "traefik.http.services.studio.loadbalancer.server.port=8085"

  jupyter:
    image: jupyter/base-notebook:latest
    container_name: jupyter_lab
    user: root
    entrypoint: ["tini", "-g", "--"]
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./.env:/home/jovyan/.env
      - ./shared:/home/jovyan/work/shared
      - ./databases:/home/jovyan/work/databases
      - ./ducklake:/home/jovyan/work/ducklake
    working_dir: /home/jovyan/work
    networks:
      - studio_jupyter_net
    ports:
      - "127.0.0.1:8889:8888"
    environment:
      - AWS_ACCESS_KEY_ID=GK2713753aca1d72db5325f212
      - AWS_SECRET_ACCESS_KEY=afd53ab8d8e6f762973bab0b5a33998265530dee63cae200e1a8e065be2a4b6e
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://garage:3900
      - AWS_S3_ALLOW_UNSAFE_RENAME=true
      - AWS_ALLOW_HTTP=true
    command:
      - /bin/bash
      - -c
      - |
        pip install uv
        uv pip install --system --break-system-packages --no-cache duckdb==1.5.4 duckrun>=0.4.31 pandas sqlframe[duckdb] psycopg2-binary
        exec jupyter lab --allow-root --ServerApp.token=analytics_secret --IdentityProvider.token=analytics_secret --ServerApp.tornado_settings="{\"headers\": {\"Content-Security-Policy\": \"frame-ancestors 'self' http://studio.localhost:8880 http://localhost:8085 http://localhost:8086 http://127.0.0.1:8085 http://127.0.0.1:8086\"}}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`jupyter.localhost`)"
      - "traefik.http.routers.jupyter.entrypoints=web"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"

